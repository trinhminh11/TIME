[project]
name = "neurips2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "dm-control>=1.0.40",
    "gymnasium[box2d,mujoco]>=1.2.3",
    "gymnasium-robotics>=1.4.1",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "mujoco-py>=2.1.2.14",
    "nvitop>=1.6.2",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "shimmy[dm-control]>=2.0.0",
    "tb-nightly>=2.21.0a20251023",
    "tensorboard>=2.20.0",
    "termcolor>=3.3.0",
    "torch>=2.5.1",
    "torchinfo>=1.8.0",
    "torchvision>=0.20.1",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
    "seaborn>=0.13.2",
]

[[tool.uv.index]]
name = "pytorch-cu122"
url = "https://download.pytorch.org/whl/cu121"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-cu122", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
