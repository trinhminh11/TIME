defaults:
  - agent: diayn
  - override hydra/launcher: submitit_local

# task settings
domain: walker # primal task will be inferred in runtime
obs_type: states # [states, pixels]
frame_stack: 3 # only works if obs_type=pixels
action_repeat: 1 # set to 2 for pixels
discount: 0.99

# train settings
num_train_frames: 2000000
num_seed_frames: 4000
num_envs: 8

# eval
eval_every_frames: 10000
num_eval_episodes: 10

# low-level pretrained controller
snapshot_ts: 1000000
snapshot_base_dir: ./pretrained_models

# snapshot
snapshots: [100000, 500000, 1000000, 2000000]
snapshot_dir: ../../../models/hrl/${obs_type}/${domain}/${agent.name}/${seed}

# PPO
ppo:
  num_steps: 256
  num_epochs: 4
  minibatch_size: 512
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3e-4
  max_grad_norm: 0.5
  normalize_advantages: true
  hidden_dim: 256

# misc
seed: 1
device: cpu
save_video: true
use_tb: false
use_wandb: false

# experiment
experiment: exp

hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S}_hrl_${agent.name}
  sweep:
    dir: ./exp_sweep/${now:%Y.%m.%d}/${now:%H%M}_hrl_${agent.name}_${experiment}
    subdir: ${hydra.job.num}
  launcher:
    timeout_min: 4300
    cpus_per_task: 10
    gpus_per_node: 1
    tasks_per_node: 1
    mem_gb: 160
    nodes: 1
    submitit_folder: ./exp_sweep/${now:%Y.%m.%d}/${now:%H%M}_hrl_${agent.name}_${experiment}/.slurm
